<section class="ticket" [attr.aria-label]="'Boarding pass for flight ' + ticket().id">
  <div class="main-stub">
    <header class="ticket-header">
      <app-ticket-logo />
      <span class="ticket-class">BOARDING PASS</span>
    </header>

    <div class="route">
      <div class="city">
        <span class="city-name">{{ ticket().from }}</span>
        <span class="city-label">FROM</span>
      </div>

      <div class="plane" aria-hidden="true">
        <svg viewBox="0 0 48 16" xmlns="http://www.w3.org/2000/svg">
          <line
            x1="0"
            y1="8"
            x2="40"
            y2="8"
            stroke="currentColor"
            stroke-width="1"
            stroke-dasharray="2 2"
          />
          <path d="M44 8 L32 2 L34 8 L32 14 Z" fill="currentColor" />
        </svg>
      </div>

      <div class="city city-right">
        <span class="city-name">{{ ticket().to }}</span>
        <span class="city-label">TO</span>
      </div>
    </div>

    <dl class="meta">
      <div class="meta-cell">
        <dt>Date</dt>
        <dd>{{ departure() | date: 'yyyy-MM-dd' }}</dd>
      </div>
      <div class="meta-cell">
        <dt>Boarding</dt>
        <dd>{{ boarding() | date: 'HH:mm' }}</dd>
      </div>
      <div class="meta-cell">
        <dt>Gate</dt>
        <dd>{{ gate }}</dd>
      </div>
      <div class="meta-cell">
        <dt>Seat</dt>
        <dd>{{ seat }}</dd>
      </div>
    </dl>

    @if (ticket().delay > 0) {
      <p class="delay-badge">Delayed by {{ ticket().delay }} min</p>
    }
  </div>

  <div class="perforation" aria-hidden="true"></div>

  <div class="boarding-stub">
    <dl class="stub-meta">
      <div>
        <dt>Flight</dt>
        <dd>FL{{ ticket().id }}</dd>
      </div>
      <div>
        <dt>Seat</dt>
        <dd>{{ seat }}</dd>
      </div>
    </dl>
  </div>
</section>
